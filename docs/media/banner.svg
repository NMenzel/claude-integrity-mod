<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Claude Integrity</title>
  <desc id="desc">Tells implemented apart from verified in Claude Code</desc>
  <rect width="1200" height="300" rx="18" fill="#1a1a1a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="56" y="92" fill="#46a758">✓</text>
    <text x="56" y="132" fill="#f5a524">?</text>
    <text x="56" y="172" fill="#f5a524">!</text>
    <text x="56" y="212" fill="#e5484d">✗</text>
    <text x="88" y="92" fill="#8a8a8a">R1 sort events · npm test</text>
    <text x="88" y="132" fill="#8a8a8a">R2 keep routes · no evidence</text>
    <text x="88" y="172" fill="#f2f2f2">MIR-B1 save() writes nothing</text>
