  <line x1="560" y1="56" x2="560" y2="244" stroke="#333" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="610" y="128" fill="#f2f2f2" font-size="54" font-weight="700">Claude Integrity</text>
    <text x="612" y="172" fill="#d97757" font-size="24" font-weight="600">Implemented is not verified</text>
    <text x="612" y="210" fill="#9a9a9a" font-size="19">Contract · Mirages · Evidence · a Claude Code mod</text>
  </g>
</svg>
